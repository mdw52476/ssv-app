<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SSV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="screen hidden">
    <div class="login-card">
      <h1>SSV</h1>
      <p class="muted">Sign in to continue</p>
      <form id="login-form">
        <input id="login-email" type="email" autocomplete="username" placeholder="Email" required>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="Password" required>
        <button type="submit" class="btn primary">Sign in</button>
        <button type="button" id="signup-btn" class="btn ghost">Create account</button>
        <p id="login-msg" class="msg"></p>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <select id="dealer" aria-label="Current account"></select>
      <span id="sync" class="sync" title="Sync status"></span>
    </header>

    <main>
      <!-- LOT -->
      <section id="tab-lot" class="tab">
        <div class="card search">
          <input id="q" type="search" inputmode="text" autocapitalize="characters" autocomplete="off"
                 placeholder="Stock # or last 5 of VIN">
          <div id="results"></div>
        </div>

        <details id="add" class="card">
          <summary>+ Add vehicle</summary>
          <form id="add-form" autocomplete="off">
            <div class="add-for">Adding to: <b id="add-for"></b></div>
            <div class="grid2">
              <input name="stock" placeholder="Stock #" autocapitalize="characters">
              <input name="vin" placeholder="VIN (last 8 or full)" autocapitalize="characters">
              <input name="year" placeholder="Year" inputmode="numeric" maxlength="4">
              <input name="color" placeholder="Color" list="colors">
              <input name="make" placeholder="Make" list="makes">
              <input name="model" placeholder="Model">
            </div>
            <div class="svc" id="svc-add"></div>
            <div class="ws-fields hidden">
              <div class="grid2">
                <input name="ws_price" placeholder="WS price $" inputmode="decimal">
                <input name="ws_part" placeholder="Part #" autocapitalize="characters">
              </div>
            </div>
            <input name="notes" placeholder="Notes (optional)">
            <button class="btn primary" type="submit">Add to list</button>
          </form>
        </details>

        <div class="list-head">
          <h2>Lot list <span id="lot-count" class="pill"></span></h2>
          <button id="present-btn" class="btn small">Present</button>
        </div>
        <div id="lot"></div>
      </section>

      <!-- BOOK: every vehicle for one dealer, like a dealer tab in the old spreadsheet -->
      <section id="tab-book" class="tab hidden">
        <div class="card book-controls">
          <select id="book-dealer" aria-label="Dealer"></select>
          <div class="grid2">
            <select id="book-status" aria-label="Status">
              <option value="all">All statuses</option>
              <option value="billed">Billed (done)</option>
              <option value="open">Open (pending / approved / waiting)</option>
              <option value="notbilled">Not billed (wholesale, declined…)</option>
            </select>
            <select id="book-svc" aria-label="Service">
              <option value="all">All services</option>
              <option value="C">Chip repair</option>
              <option value="H">Headlamps</option>
              <option value="WS">Windshield</option>
            </select>
          </div>
          <input id="book-q" type="search" autocomplete="off" placeholder="Filter: stock, VIN, make, model, color">
          <div id="book-summary" class="muted"></div>
        </div>
        <div id="book"></div>
        <button id="book-more" class="btn hidden" style="width:100%">Show more</button>
      </section>

      <!-- TODAY -->
      <section id="tab-today" class="tab hidden">
        <div class="list-head"><h2>Approved today</h2><span id="today-total" class="pill"></span></div>
        <div id="today"></div>
      </section>
    </main>

    <nav class="bottom">
      <button data-tab="lot" class="active">Lot</button>
      <button data-tab="today">Today</button>
      <button data-tab="book">Book</button>
      <button id="menu-btn">⋯</button>
    </nav>
  </div>

  <!-- vehicle action sheet -->
  <dialog id="sheet">
    <form method="dialog" id="sheet-form">
      <h3 id="sheet-title"></h3>
      <p id="sheet-sub" class="muted"></p>
      <div class="actions" id="sheet-actions"></div>
      <div class="svc" id="svc-edit"></div>
      <div class="ws-fields hidden">
        <div class="grid2">
          <input id="edit-ws-price" placeholder="WS price $" inputmode="decimal">
          <input id="edit-ws-part" placeholder="Part #" autocapitalize="characters">
        </div>
      </div>
      <label id="dealer-row" class="field">Account
        <select id="edit-dealer"></select>
      </label>
      <label id="work-date-row" class="field">Work date (invoice date)
        <input id="edit-work-date" type="date">
      </label>
      <input id="edit-note" placeholder="Note / reason">
      <input id="edit-approved-by" placeholder="Approved by (optional)">
      <div class="row">
        <button value="cancel" class="btn ghost">Close</button>
        <button value="save" id="sheet-save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- present list -->
  <dialog id="present" class="full">
    <div class="present-head">
      <h3 id="present-title"></h3>
      <button class="btn small" onclick="this.closest('dialog').close()">Done</button>
    </div>
    <table id="present-table"></table>
  </dialog>

  <dialog id="menu">
    <form method="dialog">
      <p id="menu-user" class="muted"></p>
      <button value="refresh" class="btn">Refresh data</button>
      <button value="import" class="btn ghost">Import history file…</button>
      <button value="signout" class="btn ghost">Sign out</button>
      <button value="cancel" class="btn ghost">Close</button>
    </form>
  </dialog>

  <input type="file" id="import-file" accept=".json,application/json" class="hidden">
  <datalist id="makes"></datalist>
  <datalist id="colors"></datalist>
  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
